<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Band Manager - Record Album</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        .form-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23f8f5f7' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f425af",
                        "background-light": "#f8f5f7",
                        "background-dark": "#22101c",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full flex-col">
        <header class="sticky top-0 z-10 w-full border-b border-white/10 bg-background-dark/80 backdrop-blur-md">
            <div class="container mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
                <a href="dashboard.html" class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-2xl">music_note</span>
                    <span class="font-bold text-white text-lg">Band Manager</span>
                </a>
                <div class="flex items-center justify-center rounded-lg bg-primary/20 px-4 py-2">
                    <span class="material-symbols-outlined text-primary mr-2 text-xl">account_balance_wallet</span>
                    <span id="moneyDisplay" class="font-bold text-white text-lg tracking-wider">$0</span>
                </div>
            </div>
        </header>

        <main class="flex flex-1 justify-center py-10 sm:py-16">
            <div class="container flex max-w-3xl flex-col gap-8 px-4">
                <div class="flex flex-col gap-3 text-center">
                    <h1 class="text-gray-900 dark:text-white text-4xl sm:text-5xl font-black leading-tight tracking-tighter">Record Your Next Hit Album!</h1>
                    <p class="text-gray-600 dark:text-gray-400 text-lg font-normal leading-normal">It's time to lay down some tracks and make music history.</p>
                </div>

                <div class="flex flex-col gap-6 rounded-xl bg-white/5 p-6 sm:p-8 border border-white/10">
                    <form id="albumForm">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                            <label class="flex flex-col">
                                <p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Album Name</p>
                                <input
                                    id="albumName"
                                    required
                                    maxlength="50"
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/5 focus:border-primary h-12 placeholder:text-gray-500 dark:placeholder:text-gray-400 px-4 text-base font-normal leading-normal"
                                    placeholder="e.g., 'My First Masterpiece'"
                                />
                            </label>

                            <label class="flex flex-col">
                                <p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Music Genre</p>
                                <select
                                    id="albumGenre"
                                    required
                                    class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/5 focus:border-primary h-12 px-4 text-base font-normal leading-normal"
                                >
                                    <option disabled selected value="">Choose a genre</option>
                                </select>
                            </label>
                        </div>

                        <div>
                            <h2 class="text-gray-900 dark:text-white text-xl font-bold leading-tight tracking-tight pb-4 pt-2">Choose Your Studio</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="studioOptions">
                                <!-- Studio options will be populated here -->
                            </div>
                        </div>

                        <div class="flex flex-col items-center mt-8">
                            <button
                                type="submit"
                                class="flex items-center justify-center gap-2 rounded-lg bg-primary px-8 py-3 text-lg font-bold text-white transition-transform hover:scale-105 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:scale-100"
                            >
                                <span class="material-symbols-outlined">rocket_launch</span>
                                <span>Book Recording!</span>
                            </button>
                            <a href="dashboard.html" class="mt-4 text-gray-400 hover:text-white text-sm">Back to Dashboard</a>
                        </div>
                    </form>

                    <!-- Success Message -->
                    <div id="successMessage" class="hidden p-4 rounded-lg bg-green-500/20 border border-green-500/50 text-green-300">
                        <div class="flex items-start gap-3">
                            <span class="material-symbols-outlined mt-0.5">check_circle</span>
                            <div class="flex-1">
                                <p class="font-semibold mb-1">Recording Booked!</p>
                                <p class="text-sm" id="successText"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/game-master.js"></script>
    <script src="js/game-manager.js"></script>

    <!-- Page Script -->
    <script src="js/record-album.js"></script>
</body>
</html>
