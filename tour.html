<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Band Manager - Go on Tour</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f425af",
                        "background-light": "#f8f5f7",
                        "background-dark": "#22101c",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full flex-col">
        <header class="sticky top-0 z-10 w-full border-b border-white/10 bg-background-dark/80 backdrop-blur-md">
            <div class="container mx-auto flex flex-wrap h-auto min-h-16 max-w-5xl items-center justify-between gap-2 px-4 py-2">
                <a href="dashboard.html" class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-xl sm:text-2xl">music_note</span>
                    <span class="font-bold text-white text-base sm:text-lg">Band Manager</span>
                </a>
                <div class="flex gap-2">
                    <div class="flex items-center justify-center rounded-lg bg-primary/20 px-2 sm:px-4 py-2">
                        <span class="material-symbols-outlined text-primary mr-1 sm:mr-2 text-lg sm:text-xl">star</span>
                        <span id="fameDisplay" class="font-bold text-white text-sm sm:text-lg whitespace-nowrap">0</span>
                    </div>
                    <div class="flex items-center justify-center rounded-lg bg-primary/20 px-2 sm:px-4 py-2">
                        <span class="material-symbols-outlined text-primary mr-1 sm:mr-2 text-lg sm:text-xl">account_balance_wallet</span>
                        <span id="moneyDisplay" class="font-bold text-white text-sm sm:text-lg whitespace-nowrap">$0</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex flex-1 justify-center py-10 sm:py-16">
            <div class="container flex max-w-4xl flex-col gap-8 px-4">
                <div class="flex flex-col gap-3 text-center px-4">
                    <h1 class="text-gray-900 dark:text-white text-2xl sm:text-4xl md:text-5xl font-black leading-tight tracking-tighter">Hit the Road!</h1>
                    <p class="text-gray-600 dark:text-gray-400 text-base sm:text-lg font-normal leading-normal">Choose a tour and bring your music to the people.</p>
                </div>

                <div class="flex flex-col gap-6 rounded-xl bg-white/5 p-6 sm:p-8 border border-white/10">
                    <h2 class="text-gray-900 dark:text-white text-2xl font-bold leading-tight">Available Tours</h2>

                    <div id="tourOptions" class="flex flex-col gap-4">
                        <!-- Tour options will be populated here -->
                    </div>

                    <div class="flex flex-col items-center mt-4">
                        <a href="dashboard.html" class="text-gray-400 hover:text-white text-sm">Back to Dashboard</a>
                    </div>

                    <!-- Success Message -->
                    <div id="successMessage" class="hidden p-4 rounded-lg bg-green-500/20 border border-green-500/50 text-green-300">
                        <div class="flex items-start gap-3">
                            <span class="material-symbols-outlined mt-0.5">check_circle</span>
                            <div class="flex-1">
                                <p class="font-semibold mb-1">Tour Booked!</p>
                                <p class="text-sm" id="successText"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/game-master.js"></script>
    <script src="js/game-manager.js"></script>

    <!-- Page Script -->
    <script src="js/tour.js"></script>
</body>
</html>
