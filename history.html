<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Band Manager - History</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f425af",
                        "background-light": "#f8f5f7",
                        "background-dark": "#181116",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-white">
    <div class="relative flex h-auto min-h-screen w-full flex-col">
        <div class="layout-container flex h-full grow flex-col">
            <header class="flex items-center justify-between whitespace-nowrap border-b border-black/10 dark:border-white/10 px-4 md:px-10 py-3">
                <a href="dashboard.html" class="flex items-center gap-4 text-slate-900 dark:text-white">
                    <span class="material-symbols-outlined text-primary">music_note</span>
                    <h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Band Manager</h2>
                </a>
                <div class="hidden sm:flex items-center gap-6 text-slate-700 dark:text-slate-300 text-sm">
                    <span id="bandNameHeader">Loading...</span>
                    <span id="moneyHeader">Cash: $0</span>
                </div>
            </header>

            <div class="px-4 sm:px-10 md:px-20 lg:px-40 flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
                    <main class="flex-1 p-4 md:p-6 lg:p-8">
                        <!-- Tab Navigation -->
                        <div class="flex gap-2 mb-6 border-b border-white/10">
                            <button id="albumsTab" class="px-4 py-3 font-semibold border-b-2 border-primary text-primary">
                                Albums
                            </button>
                            <button id="toursTab" class="px-4 py-3 font-semibold border-b-2 border-transparent text-gray-400 hover:text-white">
                                Tours
                            </button>
                        </div>

                        <!-- Albums Tab Content -->
                        <div id="albumsContent">
                            <div class="flex flex-wrap justify-between gap-4 py-4">
                                <div class="flex min-w-72 flex-col gap-3">
                                    <p class="text-slate-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Album History</p>
                                    <p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal">A hall of fame for all your recorded albums.</p>
                                </div>
                            </div>

                            <div class="py-3 @container">
                                <div class="flex overflow-hidden rounded-lg border border-black/10 dark:border-white/10 bg-white/50 dark:bg-black/10 shadow-sm">
                                    <table class="flex-1">
                                        <thead>
                                            <tr class="bg-slate-100 dark:bg-white/5">
                                                <th class="px-4 py-3 text-left text-slate-700 dark:text-slate-300 w-[45%] text-sm font-medium leading-normal">Album</th>
                                                <th class="px-4 py-3 text-left text-slate-700 dark:text-slate-300 w-[30%] text-sm font-medium leading-normal">Quality Score</th>
                                                <th class="px-4 py-3 text-left text-slate-700 dark:text-slate-300 w-[25%] text-sm font-medium leading-normal">Genre</th>
                                            </tr>
                                        </thead>
                                        <tbody id="albumsTableBody">
                                            <tr>
                                                <td colspan="3" class="px-4 py-12 text-center text-gray-400">
                                                    Loading...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Tours Tab Content -->
                        <div id="toursContent" class="hidden">
                            <div class="flex flex-wrap justify-between gap-4 py-4">
                                <div class="flex min-w-72 flex-col gap-3">
                                    <p class="text-slate-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Tour History</p>
                                    <p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal">All the shows you've rocked.</p>
                                </div>
                            </div>

                            <div class="py-3 @container">
                                <div class="flex overflow-hidden rounded-lg border border-black/10 dark:border-white/10 bg-white/50 dark:bg-black/10 shadow-sm">
                                    <table class="flex-1">
                                        <thead>
                                            <tr class="bg-slate-100 dark:bg-white/5">
                                                <th class="px-4 py-3 text-left text-slate-700 dark:text-slate-300 w-[40%] text-sm font-medium leading-normal">Tour</th>
                                                <th class="px-4 py-3 text-left text-slate-700 dark:text-slate-300 w-[30%] text-sm font-medium leading-normal">Money Made</th>
                                                <th class="px-4 py-3 text-left text-slate-700 dark:text-slate-300 w-[30%] text-sm font-medium leading-normal">Fame Gained</th>
                                            </tr>
                                        </thead>
                                        <tbody id="toursTableBody">
                                            <tr>
                                                <td colspan="3" class="px-4 py-12 text-center text-gray-400">
                                                    Loading...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Back Button -->
                        <div class="flex px-4 py-8 justify-center">
                            <a href="dashboard.html" class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20">
                                <span class="truncate">Back to Dashboard</span>
                            </a>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/game-master.js"></script>
    <script src="js/game-manager.js"></script>

    <!-- Page Script -->
    <script src="js/history.js"></script>
</body>
</html>
